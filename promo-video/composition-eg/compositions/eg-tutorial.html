      const lb = (x, y, t) => { const e = document.createElementNS(NS, "text"); e.setAttribute("x", x); e.setAttribute("y", y); e.setAttribute("font-size", "2"); e.setAttribute("fill", "#30363d"); e.setAttribute("stroke", "none"); e.textContent = t; rulers.appendChild(e); };

      // ---------- The run ----------
