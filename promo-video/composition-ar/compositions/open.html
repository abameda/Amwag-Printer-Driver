  </style>

  <script>
    (function () {
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const AR = vars.lang === "ar";
      const root = document.querySelector(".scene-open");
      root.setAttribute("dir", AR ? "rtl" : "ltr");
      root.setAttribute("lang", AR ? "ar" : "en");
      const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
      root.querySelectorAll("[data-en]").forEach((el) => {
        const text = AR ? el.dataset.ar : el.dataset.en;
        if (text.includes("*")) el.innerHTML = esc(text).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>');
        else el.textContent = text;
      });
      // The splash mirrors in Arabic like the app does.
      if (AR) document.getElementById("open-splash").setAttribute("dir", "rtl");
      function words(el) {
        // One span per word; in Arabic a run of Latin words (a product name) stays one left-to-right span.
        const groups = [];
        Array.from(el.childNodes).forEach((node) => {
          const hl = node.nodeType === 1;
          node.textContent.split(" ").filter(Boolean).forEach((t) => {
            const latin = /[A-Za-z]/.test(t) && !/[؀-ۿ]/.test(t);
            const last = groups[groups.length - 1];
            if (AR && latin && last && last.latin && last.hl === hl) last.text += " " + t;
            else groups.push({ text: t, latin: latin, hl: hl });
          });
        });
        el.textContent = "";
        return groups.map((g, i) => {
          const s = document.createElement("span");
          s.className = "w" + (g.hl ? " hl" : "");
          if (AR && g.latin) s.setAttribute("dir", "ltr");
          s.textContent = g.text;
          el.appendChild(s);
          // The space sits between pieces, so it lands on the correct side in both directions.
          if (i < groups.length - 1) el.appendChild(document.createTextNode(" "));
          return s;
        });
      }
      const title = words(document.getElementById("open-cap-title"));

      // Window-space point; the window mirrors in Arabic, the mouse pointer does not.
      const P = (x, y) => ({ x: AR ? 840 - x : x, y: y });
      const start = P(560, 560);
      const exe = P(150, 214);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#open-wave", { x: -64 }, { x: -118, duration: 5.4, ease: "none" }, 0);
      tl.set("#open-cam", { scale: 1.3, x: 0, y: 0 }, 0);

      // Window and caption arrive.
      tl.fromTo("#open-view", { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.05);
      tl.fromTo("#open-cap .cap-label", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.2);
      tl.fromTo("#open-rail", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.25);
      tl.fromTo("#open-r1", { backgroundColor: "rgba(255,255,255,0.18)" }, { backgroundColor: "#ffffff", duration: 0.3, ease: "power2.out" }, 0.35);
      tl.fromTo(title, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.067 }, 0.35);
      tl.fromTo("#open-cap-help", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, 0.75);

      // The pointer glides to the exe and double-clicks it.
      tl.fromTo("#open-cursor", { opacity: 0, x: start.x, y: start.y }, { opacity: 1, duration: 0.15 }, 0.7);
      tl.to("#open-cursor", { x: exe.x, y: exe.y, duration: 0.85, ease: "power2.inOut" }, 0.75);
      // Punch in on the exe row while it is double-clicked, then back out for the splash.
      const s = 1.3 * 1.7;
      const fx = Math.min(0, Math.max(1092 - 840 * s, 546 - (AR ? 840 - 220 : 220) * s));
      const fy = Math.min(0, Math.max(868 - 668 * s, 434 - 212 * s));
      tl.to("#open-cam", { scale: s, x: fx, y: fy, duration: 0.7, ease: "power2.inOut" }, 0.95);
      tl.to("#open-cam", { scale: 1.3, x: 0, y: 0, duration: 0.6, ease: "power2.inOut" }, 2.05);
      tl.to("#open-exe-hover", { opacity: 1, duration: 0.1 }, 1.45);
      tl.to("#open-cursor", { scale: 0.88, duration: 0.05, ease: "power1.out", transformOrigin: "0 0" }, 1.75);
      tl.to("#open-cursor", { scale: 1, duration: 0.07, ease: "power1.out" }, 1.8);
      tl.to("#open-exe-sel", { opacity: 1, duration: 0.05 }, 1.75);
      tl.to("#open-cursor", { scale: 0.88, duration: 0.05, ease: "power1.out" }, 1.9);
      tl.to("#open-cursor", { scale: 1, duration: 0.07, ease: "power1.out" }, 1.95);
      tl.to("#open-cursor", { opacity: 0, duration: 0.15 }, 2.35);

      // The splash loads (StartupSplash: "Loading settings…" then "Opening the window…").
      tl.fromTo("#open-splash", { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" }, 2.15);
      tl.fromTo("#open-sp-fill", { scaleX: 0 }, { scaleX: 0.6, duration: 1.1, ease: "power1.inOut" }, 2.35);
      tl.fromTo("#open-sp-pct", { innerText: 0 }, { innerText: 60, duration: 1.1, ease: "power1.inOut", snap: { innerText: 1 },
        modifiers: { innerText: (v) => Math.round(v) + "%" } }, 2.35);
      tl.set("#open-sp-t1", { opacity: 0 }, 3.55);
      tl.set("#open-sp-t2", { opacity: 1 }, 3.55);
      tl.to("#open-sp-fill", { scaleX: 1, duration: 0.8, ease: "power1.inOut" }, 3.55);
      tl.fromTo("#open-sp-pct", { innerText: 60 }, { innerText: 100, duration: 0.8, ease: "power1.inOut", snap: { innerText: 1 },
        modifiers: { innerText: (v) => Math.round(v) + "%" }, immediateRender: false }, 3.55);

      // Caption leaves, then the splash zooms through into the app window.
      tl.to(["#open-cap", "#open-rail"], { opacity: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, 4.75);
      tl.to("#open-splash", { scale: 1.22, opacity: 0, filter: "blur(10px)", duration: 0.4, ease: "power3.in", transformOrigin: "50% 50%" }, 4.85);
      tl.to(".scene-open .fx", { opacity: 0, duration: 0.3, ease: "power2.in" }, 4.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["open"] = tl;
    })();
  </script>
